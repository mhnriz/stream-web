<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>StreamApp</title>
  <meta name="description" content="Premium self-hosted streaming platform">
  <meta name="theme-color" content="#0F1118">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script>
    // Theme bootstrap — runs before CSS paints to avoid a flash of wrong theme
    (function () {
      try {
        var t = localStorage.getItem('theme');
        if (!t) t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        document.documentElement.dataset.theme = t;
        if (t === 'light') {
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.content = '#F7F8FA';
        }
      } catch (e) { /* default dark */ }
    })();
  </script>
  <link rel="stylesheet" href="/css/app.css?v=1.3.8">
  <link rel="stylesheet" href="/css/responsive.css?v=1.3.8">
  <link rel="stylesheet" href="/css/themes.css?v=1.3.8">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='28' font-size='28'>🎬</text></svg>">
</head>
<body>
  <a href="#main-content" class="skip-link">Skip to content</a>
  <div id="app">
    <!-- Sidebar -->
    <nav id="sidebar" class="sidebar" aria-label="Primary navigation">
      <div class="sidebar-logo">
        <div class="logo-icon">
          <svg width="36" height="36" viewBox="0 0 36 36" fill="none">
            <circle cx="18" cy="18" r="16" fill="url(#logoGrad)" opacity="0.9"/>
            <path d="M14 12l10 6-10 6V12z" fill="#0F1118" opacity="0.9"/>
            <defs><linearGradient id="logoGrad" x1="0" y1="0" x2="36" y2="36">
              <stop offset="0%" stop-color="#BBE5ED"/>
              <stop offset="100%" stop-color="#B399A2"/>
            </linearGradient></defs>
          </svg>
        </div>
      </div>

      <div class="sidebar-nav">
        <a href="/" class="nav-item active" data-page="home" data-tooltip="Home" aria-label="Home">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        </a>
        <a href="/search" class="nav-item" data-page="search" data-tooltip="Search" aria-label="Search">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        </a>
        <a href="/movies" class="nav-item" data-page="movies" data-tooltip="Movies" aria-label="Movies">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="2.18" ry="2.18"/><line x1="7" y1="2" x2="7" y2="22"/><line x1="17" y1="2" x2="17" y2="22"/><line x1="2" y1="12" x2="22" y2="12"/><line x1="2" y1="7" x2="7" y2="7"/><line x1="2" y1="17" x2="7" y2="17"/><line x1="17" y1="7" x2="22" y2="7"/><line x1="17" y1="17" x2="22" y2="17"/></svg>
        </a>
        <a href="/series" class="nav-item" data-page="series" data-tooltip="TV Series" aria-label="TV Series">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="15" rx="2" ry="2"/><polyline points="17 2 12 7 7 2"/></svg>
        </a>
        <a href="/anime" class="nav-item" data-page="anime" data-tooltip="Anime" aria-label="Anime">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
        </a>
        <a href="/watchlist" class="nav-item" data-page="watchlist" data-tooltip="Watchlist" aria-label="Watchlist">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
        </a>
        <a href="/library" class="nav-item" data-page="library" data-tooltip="Library" aria-label="Library">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
        </a>
      </div>

      <div class="sidebar-bottom">
        <a href="/settings" class="nav-item" data-page="settings" data-tooltip="Settings" aria-label="Settings">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </a>
      </div>
    </nav>

    <!-- Main content area -->
    <main id="main-content" class="main-content" tabindex="-1">
      <div id="page-container" class="page-container"></div>
    </main>

    <!-- Video Player Overlay -->
    <div id="player-overlay" class="player-overlay hidden" role="dialog" aria-label="Video player">
      <div class="player-wrapper">
        <video id="video-player" crossorigin="anonymous"></video>
        <div id="player-buffering" class="player-buffering">
          <div class="buffering-bars">
            <span></span><span></span><span></span><span></span><span></span>
          </div>
          <div class="buffering-text">loading</div>
        </div>
        <div id="player-ui" class="player-ui">
          <div class="player-top-bar">
            <button id="player-back" class="player-btn" aria-label="Back — close player">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
            </button>
            <span id="player-title" class="player-title"></span>
            <span id="player-hint" class="player-hint"></span>
            <div class="player-top-actions">
              <button id="player-pip" class="player-btn" title="Picture-in-Picture">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2"/><rect x="12" y="9" width="8" height="6" rx="1" fill="currentColor" opacity="0.3"/></svg>
              </button>
              <button id="player-settings-btn" class="player-btn" title="Settings">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
              </button>
            </div>
          </div>

          <div class="player-bottom-bar">
            <div class="player-progress-container">
              <div class="player-progress-bar">
                <div id="player-buffer" class="player-buffer"></div>
                <div id="player-progress" class="player-progress"></div>
                <input type="range" id="player-seek" class="player-seek" min="0" max="100" step="0.1" value="0" aria-label="Seek position">
              </div>
              <div class="player-time">
                <span id="player-current-time">0:00</span>
                <span id="player-duration">0:00</span>
              </div>
            </div>
            <div class="player-bottom-controls">
              <div class="player-bottom-left">
                <button id="player-episodes-btn" class="player-ctrl-btn" style="display:none" aria-label="Episodes">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="15" rx="2" ry="2"/><polyline points="17 2 12 7 7 2"/></svg>
                  <span>Episodes</span>
                </button>
                <button id="player-audio-subs" class="player-ctrl-btn" aria-label="Audio and subtitles">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
                  <span>Audio & Subtitles</span>
                </button>
              </div>

              <!-- Centre: RW · Play/Pause · FF -->
              <div class="player-bottom-center">
                <button id="player-rw" class="player-btn player-btn-lg" aria-label="Rewind 10 seconds">
                  <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M1 4v6h6"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/><text x="12" y="15" text-anchor="middle" fill="currentColor" font-size="7" font-weight="600" stroke="none">10</text></svg>
                </button>
                <button id="player-play-pause" class="player-btn player-btn-play" aria-label="Play or pause">
                  <svg id="play-icon" width="36" height="36" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                  <svg id="pause-icon" width="36" height="36" viewBox="0 0 24 24" fill="currentColor" class="hidden"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
                </button>
                <button id="player-ff" class="player-btn player-btn-lg" aria-label="Forward 10 seconds">
                  <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M23 4v6h-6"/><path d="M20.49 15a9 9 0 1 1-2.13-9.36L23 10"/><text x="12" y="15" text-anchor="middle" fill="currentColor" font-size="7" font-weight="600" stroke="none">10</text></svg>
                </button>
              </div>

              <div class="player-bottom-right">
                <button id="player-speed" class="player-ctrl-btn" aria-label="Playback speed">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                  <span id="speed-label">Speed (1.0x)</span>
                </button>
                <button id="player-volume-btn" class="player-ctrl-btn" aria-label="Mute or unmute">
                  <!-- TASK-12: dual icons, toggled by JS -->
                  <svg id="vol-icon-on" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
                  <svg id="vol-icon-off" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="hidden"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>
                </button>
                <input type="range" id="player-volume" class="player-volume" min="0" max="1" step="0.05" value="1" aria-label="Volume">
                <button id="player-fullscreen" class="player-ctrl-btn" aria-label="Toggle fullscreen">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/></svg>
                </button>
              </div>
            </div>
          </div>
        </div>

        <!-- TASK-10: Skip Intro button -->
        <button id="skip-intro-btn" class="skip-intro-btn hidden" aria-label="Skip intro">
          Skip Intro
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
        </button>

        <!-- TASK-07: Up Next end card -->
        <div id="end-card" class="end-card hidden">
          <div class="end-card-inner">
            <div class="end-card-label">Up Next</div>
            <div class="end-card-title" id="end-card-title"></div>
            <div class="end-card-countdown">
              <svg class="end-card-ring" viewBox="0 0 36 36">
                <circle cx="18" cy="18" r="15" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="2"/>
                <circle id="end-card-ring-fill" cx="18" cy="18" r="15" fill="none" stroke="var(--accent)" stroke-width="2"
                  stroke-dasharray="94.2" stroke-dashoffset="94.2" stroke-linecap="round"
                  transform="rotate(-90 18 18)"/>
                <text id="end-card-seconds" x="18" y="22" text-anchor="middle" fill="white" font-size="10" font-weight="700">10</text>
              </svg>
            </div>
            <div class="end-card-actions">
              <button id="end-card-play" class="btn btn-primary" style="font-size:0.82rem;padding:8px 18px">Play Now</button>
              <button id="end-card-cancel" class="btn btn-secondary" style="font-size:0.82rem;padding:8px 14px">Cancel</button>
            </div>
          </div>
        </div>

        <!-- Settings panel -->
        <div id="settings-panel" class="player-panel hidden">
          <div class="panel-header">
            <h3>Settings</h3>
            <button class="panel-close">&times;</button>
          </div>
          <div class="panel-list">
            <div class="panel-item" data-speed="0.5">0.5x</div>
            <div class="panel-item" data-speed="0.75">0.75x</div>
            <div class="panel-item active" data-speed="1">1.0x (Normal)</div>
            <div class="panel-item" data-speed="1.25">1.25x</div>
            <div class="panel-item" data-speed="1.5">1.5x</div>
            <div class="panel-item" data-speed="2">2.0x</div>
          </div>
        </div>
      </div>
    </div>

    <!-- Toast notifications -->
    <div id="toast-container" class="toast-container" aria-live="polite"></div>

    <!-- Splash screen — shown on initial load, dismissed once home content is ready -->
    <div id="loading-overlay" class="splash-screen">
      <div class="splash-inner">
        <div class="splash-logo">
          <svg width="56" height="56" viewBox="0 0 36 36" fill="none">
            <circle cx="18" cy="18" r="16" fill="url(#splashGrad)" opacity="0.9"/>
            <path d="M14 12l10 6-10 6V12z" fill="#0F1118" opacity="0.9"/>
            <defs><linearGradient id="splashGrad" x1="0" y1="0" x2="36" y2="36">
              <stop offset="0%" stop-color="#BBE5ED"/>
              <stop offset="100%" stop-color="#B399A2"/>
            </linearGradient></defs>
          </svg>
        </div>
        <div class="splash-title">StreamApp</div>
        <div class="splash-subtitle">Loading your content…</div>
        <div class="splash-bar-wrap">
          <div class="splash-bar" id="splash-bar"></div>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="/js/app.js?v=1.3.8"></script>
</body>
</html>
